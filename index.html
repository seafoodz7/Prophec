<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Blurred Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 30px 0;
    }

    /* Container holding all cards stacked vertically */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      align-items: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 90%;
      width: 420px;
    }

    .img-container {
      width: 100%;
      height: 300px;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: #e0e0e0;
      position: relative;
    }

    /* Heavy blur filter applied by default */
    .picture {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(25px);
      transition: filter 0.4s ease-in-out;
    }

    .picture.unblurred {
      filter: blur(0px);
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }

    .errorMsg {
      color: #d9534f;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .counter {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- Vertical Stack Container -->
  <div id="gallery" class="gallery"></div>

  <script>
    const gallery = document.getElementById('gallery');
    const totalImages = 100;

    // Loop from 1 to 100 to generate cards sequentially from top to bottom
    for (let i = 1; i <= totalImages; i++) {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="img-container">
          <img class="picture" src="./Images/photo${i}.jpg" alt="Photo ${i}">
        </div>
        <div class="controls">
          <button class="toggleBtn">Unblur</button>
        </div>
        <p class="counter">Image ${i} of ${totalImages}</p>
        <p class="errorMsg">Image failed to load. Check path or file name.</p>
      `;

      const img = card.querySelector('.picture');
      const toggleBtn = card.querySelector('.toggleBtn');
      const errorMsg = card.querySelector('.errorMsg');

      // Individual unblur toggle for each photo card
      toggleBtn.addEventListener('click', () => {
        img.classList.toggle('unblurred');
        toggleBtn.textContent = img.classList.contains('unblurred') ? 'Blur Again' : 'Unblur';
      });

      // Error handling if an image path fails on GitHub Pages
      img.onerror = () => {
        errorMsg.textContent = `Failed to load: ./images/photo${i}.jpg`;
        errorMsg.style.display = 'block';
      };

      gallery.appendChild(card);
    }
  </script>

</body>
</html>
